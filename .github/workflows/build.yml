name: Build OpenJDK 8 for Android & iOS

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 */2 *'

jobs:
  build_android:
    strategy:
      matrix:
        arch: [ "aarch32", "aarch64", "x86", "x86_64" ]
      fail-fast: false
    name: "Build for Android ${{matrix.arch}}"
    runs-on: ubuntu-22.04
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set locale to UTF-8
        run: |
          sudo locale-gen en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8

      - name: set up JDK 1.7
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: zulu

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip \
          systemtap-sdt-dev gcc-multilib g++-multilib libxtst-dev libasound2-dev \
          libelf-dev libfontconfig1-dev libx11-dev

      - name: Build with CI build script
        run: bash "ci_build_arch_${{matrix.arch}}.sh"

      - name: Upload JDK build output
        uses: actions/upload-artifact@v4
        with:
          name: "jdk8-${{matrix.arch}}"
          path: jdk8*.tar.xz

      - name: Setup tmate session if failed
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: 'jre8-${{matrix.arch}}'
          path: jre8*.tar.xz

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre8-debuginfo-${{matrix.arch}}"
          path: dizout

  build_iosport:
    name: "Build for iOS aarch64"
    runs-on: macos-latest
    continue-on-error: true
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set locale to UTF-8
        run: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8

      - name: set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: zulu

      - name: Patch Encodings.properties to UTF-8 (macOS safe)
        run: |
          FILE=jaxp/src/com/sun/org/apache/xml/internal/serializer/Encodings.properties
          if [ -f "$FILE" ]; then
            iconv -f ISO-8859-1 -t UTF-8 "$FILE" > "${FILE}.utf8"
            mv "${FILE}.utf8" "$FILE"
            echo "Patched $FILE to UTF-8"
          else
            echo "File $FILE không tồn tại, bỏ qua patch"
          fi

      - name: Build with CI build script
        run: |
          export BUILD_IOS=1
          export PATH=/opt/procursus/bin:/opt/homebrew/bin:$PATH
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          bash "ci_build_arch_aarch64.sh"

      - name: Upload JDK build output
        uses: actions/upload-artifact@v4
        with:
          name: "jdk8-ios-aarch64"
          path: jdk8*.tar.xz

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: 'jre8-ios-aarch64'
          path: jre8*.tar.xz

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre8-ios-debuginfo-aarch64"
          path: dizout

  pojav:
    needs: build_android
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get jre8-aarch32
        uses: actions/download-artifact@v4
        with:
          name: jre8-aarch32
          path: pojav

      - name: Get jre8-aarch64
        uses: actions/download-artifact@v4
        with:
          name: jre8-aarch64
          path: pojav

      - name: Get jre8-x86
        uses: actions/download-artifact@v4
        with:
          name: jre8-x86
          path: pojav

      - name: Get jre8-x86_64
        uses: actions/download-artifact@v4
        with:
          name: jre8-x86_64
          path: pojav

      - name: Repack JRE
        run: bash "repackjre.sh" $GITHUB_WORKSPACE/pojav $GITHUB_WORKSPACE/pojav/jre8-pojav

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jre8-pojav
          path: pojav/jre8-pojav/*
